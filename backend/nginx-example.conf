# Example server block: adjust certificate paths and confirm Certbot/HTTPS first.
# CRITICAL: remove any other location/alias serving /var/www/handball-analyse directly.
server {
    listen 80;
    server_name wurfbilder.duckdns.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name wurfbilder.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/wurfbilder.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wurfbilder.duckdns.org/privkey.pem;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
